syntax = "proto3";

package safari_sdk.protos;

import "google/protobuf/timestamp.proto";

// Wire-compatible representation of
// google.robotics.developer.v1.CmCustomBidiRequest for external Safari SDK
// builds.
message CmCustomBidiRequest {
  message SaxModelConfig {
    string model_id = 1;
    string method_name = 2;
    bytes model_options = 3;
  }

  message CmCustomSetup {
    oneof model_config {
      SaxModelConfig sax_config = 1;
    }
  }

  message CmCustomObservation {
    bytes input_bytes = 1;
    int64 request_id = 2;
  }

  oneof payload {
    CmCustomSetup setup = 1;
    CmCustomObservation observation = 2;
  }
}

// Wire-compatible representation of
// google.robotics.developer.v1.CmCustomBidiResponse for external Safari SDK
// builds.
message CmCustomBidiResponse {
  enum ResponseType {
    RESPONSE_TYPE_UNSPECIFIED = 0;
    SETUP_ACK = 1;
    ACTION_CHUNK = 2;
    ERROR = 3;
  }

  message RpcStatus {
    int32 code = 1;
    string message = 2;
    repeated bytes details = 3;
  }

  ResponseType response_type = 1;
  bytes output_bytes = 2;
  int64 request_id = 3;
  optional google.protobuf.Timestamp backend_request_time = 4;
  optional google.protobuf.Timestamp backend_response_time = 5;
  optional RpcStatus status = 6;
  int32 chunk_index = 7;
  bool final_chunk = 8;
}
